[project]
name = "amortize"
version = "0.1.0"
description = "A local proxy that makes AI agents cheaper to run: lighten every run, amortize repeat runs, prove the savings."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Amortize" }]
keywords = ["llm", "proxy", "agents", "tokens", "cost", "observability"]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.28",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "typer>=0.15",
    "rich>=13.9",
    "python-dotenv>=1.0",
    "streamlit>=1.41",
    "snowflake-connector-python>=3.13",
    "anthropic>=0.45",
    "openai>=1.60",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.9"]
everos = [
    "everos>=1.2.2 ; python_full_version >= '3.12'",
]

[project.scripts]
amort = "amort.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["amort"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length is formatter's job

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
